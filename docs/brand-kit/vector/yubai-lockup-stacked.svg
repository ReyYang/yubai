<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020">
  <title>余白 Yubai — Stacked Brand Lockup</title>
  <defs>
    <clipPath id="squircleClip"><path d="M 512 0 C 773 0 879 0 951.5 72.5 C 1024 145 1024 251 1024 512 C 1024 773 1024 879 951.5 951.5 C 879 1024 773 1024 512 1024 C 251 1024 145 1024 72.5 951.5 C 0 879 0 773 0 512 C 0 251 0 145 72.5 72.5 C 145 0 251 0 512 0 Z"/></clipPath>
    <clipPath id="leftClip"><rect x="0" y="0" width="722" height="1024"/></clipPath>
    <clipPath id="rightClip"><rect x="722" y="0" width="302" height="1024"/></clipPath>

    <linearGradient id="mossBase" x1="0.15" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#5B8659"/>
      <stop offset="52%" stop-color="#557F53"/>
      <stop offset="100%" stop-color="#476846"/>
    </linearGradient>
    <linearGradient id="mossBaseDark" x1="0.15" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#2F422E"/>
      <stop offset="55%" stop-color="#263625"/>
      <stop offset="100%" stop-color="#1B271A"/>
    </linearGradient>
    <linearGradient id="seamDropRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#243B23" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#243B23" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seamDropRightDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090D09" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#090D09" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sageLeafMain" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#98B795"/>
      <stop offset="55%" stop-color="#557F53"/>
      <stop offset="100%" stop-color="#416140"/>
    </linearGradient>
    <linearGradient id="sageLeafLeft" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0%" stop-color="#9CB999"/>
      <stop offset="58%" stop-color="#557F53"/>
      <stop offset="100%" stop-color="#3F603E"/>
    </linearGradient>
    <linearGradient id="sageLeafRight" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#90B08D"/>
      <stop offset="55%" stop-color="#557F53"/>
      <stop offset="100%" stop-color="#3F603E"/>
    </linearGradient>
    <linearGradient id="sageLeafDark" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#A9C9A6"/>
      <stop offset="58%" stop-color="#86A884"/>
      <stop offset="100%" stop-color="#5D7E5B"/>
    </linearGradient>
    <linearGradient id="tabGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEFBEA" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#F5F1E5" stop-opacity="0.82"/>
      <stop offset="55.6%" stop-color="#D6E2CC" stop-opacity="0.54"/>
      <stop offset="100%" stop-color="#C3D3B8" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="tabGlassDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5B34" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#6B4F2C" stop-opacity="0.66"/>
      <stop offset="55.6%" stop-color="#4A4330" stop-opacity="0.54"/>
      <stop offset="100%" stop-color="#3D3929" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="squircleRim" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FEFBEA" stop-opacity="0.34"/>
    </linearGradient>

    <filter id="softWindow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softShadowLeft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="softShadowRight" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
  </defs>
  <rect width="1000" height="1020" rx="48" fill="#F5F1E5"/>
  <g transform="translate(244, 92) scale(0.5)">
    <g clip-path="url(#squircleClip)">
      
    <!-- Right Moss-Sage Base + Diagonal Afternoon Window Light ("光") -->
    <rect width="1024" height="1024" fill="url(#mossBase)"/>
    <g filter="url(#softWindow)">
      <path d="M 722 188 L 1004 38 V 364 H 722 Z" fill="#88AA7B" opacity="0.50"/>
      <rect x="722" y="402" width="282" height="316" fill="#7FA173" opacity="0.42"/>
      <rect x="722" y="746" width="282" height="260" fill="#6B8E61" opacity="0.24"/>
    </g>
    <!-- Far bamboo shadow on right moss panel (unified group opacity = zero overlap seams!) -->
    <g clip-path="url(#rightClip)">
      <g opacity="0.62" filter="url(#softShadowRight)" fill="#2B462A">
        
    <!-- Tapered shadow stem rising smoothly from culm node (410,864) into slender shoot tip (710,404) -->
    <path d="M 407 864 C 462 796 524 702 586 602 C 628 534 670 468 710 404 C 676 472 636 540 596 608 C 534 708 472 802 418 872 Z"/>
    <!-- Subtle bamboo culm node on shadow stem -->
    <ellipse cx="506" cy="735" rx="8.5" ry="5" transform="rotate(-53 506 735)"/>
    <!-- Tall top leaf rising into soft shadow behind bookmark capsule -->
    <path d="M 624 554 C 602 454 612 362 648 284 C 668 366 668 460 634 558 Z"/>
    <!-- Upper-left leaf -->
    <path d="M 594 592 C 552 510 514 438 476 376 C 534 430 578 502 606 586 Z"/>
    <!-- Mid-left leaf -->
    <path d="M 582 608 C 530 552 492 496 466 438 C 522 480 564 538 594 600 Z"/>
    <!-- Right-crossing upper main leaf (crosses x=722 seam onto moss-sage panel to tip 872,438) -->
    <path d="M 626 552 C 704 500 788 462 872 438 C 804 494 722 538 634 566 Z"/>
    <!-- Right-crossing middle leaf -->
    <path d="M 606 580 C 680 554 756 544 828 544 C 758 574 684 590 614 594 Z"/>
    <!-- Lower-right crossing leaf -->
    <path d="M 580 616 C 646 610 708 634 758 680 C 692 660 632 644 576 630 Z"/>

      </g>
    </g>
    <!-- Vertical seam ambient contact shadow on moss panel -->
    <rect x="722" y="0" width="24" height="1024" fill="url(#seamDropRight)"/>

    <!-- Left 70.5% Warm Parchment Frosted Glass + Diagonal Window Sunlight -->
    <g clip-path="url(#leftClip)">
      <rect x="0" y="0" width="722" height="1024" fill="#EAE2CF"/>
