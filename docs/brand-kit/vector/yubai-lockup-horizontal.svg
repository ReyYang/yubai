        <rect x="278" y="396" width="444" height="628" fill="#FEFBEA" opacity="0.90"/>
      </g>
      <!-- Unified far bamboo shadow behind frosted warm-paper glass -->
      <g opacity="0.62" filter="url(#softShadowLeft)" fill="#9D8C6F">
        
    <!-- Tapered shadow stem rising smoothly from culm node (410,864) into slender shoot tip (710,404) -->
    <path d="M 407 864 C 462 796 524 702 586 602 C 628 534 670 468 710 404 C 676 472 636 540 596 608 C 534 708 472 802 418 872 Z"/>
    <!-- Subtle bamboo culm node on shadow stem -->
    <ellipse cx="506" cy="735" rx="8.5" ry="5" transform="rotate(-53 506 735)"/>
    <!-- Tall top leaf rising into soft shadow behind bookmark capsule -->
    <path d="M 624 554 C 602 454 612 362 648 284 C 668 366 668 460 634 558 Z"/>
    <!-- Upper-left leaf -->
    <path d="M 594 592 C 552 510 514 438 476 376 C 534 430 578 502 606 586 Z"/>
    <!-- Mid-left leaf -->
    <path d="M 582 608 C 530 552 492 496 466 438 C 522 480 564 538 594 600 Z"/>
    <!-- Right-crossing upper main leaf (crosses x=722 seam onto moss-sage panel to tip 872,438) -->
    <path d="M 626 552 C 704 500 788 462 872 438 C 804 494 722 538 634 566 Z"/>
    <!-- Right-crossing middle leaf -->
    <path d="M 606 580 C 680 554 756 544 828 544 C 758 574 684 590 614 594 Z"/>
    <!-- Lower-right crossing leaf -->
    <path d="M 580 616 C 646 610 708 634 758 680 C 692 660 632 644 576 630 Z"/>

      </g>
    </g>

    <!-- Crisp iOS 27 vertical optical glass seam at x=722 -->
    <rect x="719.5" y="0" width="3" height="1024" fill="#FFFFFF" opacity="0.88"/>
    <rect x="722.5" y="0" width="1.5" height="1024" fill="#365335" opacity="0.28"/>

    <!-- Foreground Crisp UI-Sage Bamboo Sprig -->
    <g>
    <!-- Main culm & branch with organic bamboo node joint at (411,860) -->
    <path d="M 342 1024 C 366 970 389 916 407 866 C 399 802 384 746 367 696 L 380 692 C 398 742 413 800 421 866 C 403 918 380 972 357 1024 Z" fill="#426241"/>
    <ellipse cx="412" cy="862" rx="11.5" ry="7" transform="rotate(-22 412 862)" fill="#395738"/>
    <!-- Organic petiole branches seamlessly connecting stem to every leaf base -->
    <path d="M 373 698 C 372 684 373 672 377 658" fill="none" stroke="#456644" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 376 708 C 384 700 392 694 400 686" fill="none" stroke="#456644" stroke-width="6" stroke-linecap="round"/>
    <path d="M 371 700 C 358 692 346 686 332 680" fill="none" stroke="#456644" stroke-width="6" stroke-linecap="round"/>

    <!-- 1. Slender inner shoot -->
    <path d="M 372 676 C 344 614 314 556 282 504 C 322 548 354 606 380 672 Z" fill="#688D67"/>
    <path d="M 282 504 C 322 548 354 606 378 668" fill="none" stroke="#DCEBD0" stroke-width="1.4" stroke-opacity="0.78" stroke-linecap="round"/>

    <!-- 2. Long arching upper-left tender shoot -->
    <path d="M 368 680 C 302 600 214 542 120 518 C 218 530 308 582 376 672 Z" fill="#688D67"/>
    <path d="M 120 518 C 218 530 308 582 373 668" fill="none" stroke="#DCEBD0" stroke-width="1.5" stroke-opacity="0.80" stroke-linecap="round"/>

    <!-- 3. Primary upright center leaf (tip 416,398) + sunlit upper-edge rim + midrib vein -->
    <path d="M 374 678 C 344 576 366 478 416 398 C 424 498 410 598 383 680 Z" fill="url(#sageLeafMain)"/>
    <path d="M 374 668 C 346 574 367 478 416 398 C 422 482 413 568 390 648" fill="none" stroke="#E2EFE0" stroke-width="2" stroke-opacity="0.82" stroke-linecap="round"/>
    <path d="M 379 668 C 378 584 392 496 414 412" fill="none" stroke="#B5D1B1" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- 4. Primary left spreading leaf (tip 128,576) + sunlit upper-edge rim + midrib vein -->
    <path d="M 372 702 C 282 690 198 640 128 576 C 220 600 308 644 376 690 Z" fill="url(#sageLeafLeft)"/>
    <path d="M 128 576 C 218 600 304 642 370 688" fill="none" stroke="#E2EFE0" stroke-width="2.1" stroke-opacity="0.85" stroke-linecap="round"/>
    <path d="M 364 695 C 292 664 216 624 144 584" fill="none" stroke="#B5D1B1" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- 5. Primary right ascending leaf (tip 516,526) + sunlit upper-edge rim + midrib vein -->
    <path d="M 382 714 C 398 638 452 576 516 526 C 492 612 446 690 394 720 Z" fill="url(#sageLeafRight)"/>
    <path d="M 385 704 C 400 634 453 575 516 526 C 495 600 456 668 406 708" fill="none" stroke="#E2EFE0" stroke-width="2" stroke-opacity="0.80" stroke-linecap="round"/>
    <path d="M 392 712 C 424 654 464 594 506 538" fill="none" stroke="#B5D1B1" stroke-width="1.8" stroke-opacity="0.62" stroke-linecap="round"/>
    </g>

    <!-- Upper-right Liquid Glass Bookmark Capsule + Cast Shadow -->
    <rect x="626" y="260" width="192" height="76" rx="16" fill="#263D25" opacity="0.26" filter="url(#tabShadow)"/>
    <rect x="617" y="253" width="190" height="74" rx="16" fill="url(#tabGlass)" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="2.5"/>

      <path d="M 512 0 C 773 0 879 0 951.5 72.5 C 1024 145 1024 251 1024 512 C 1024 773 1024 879 951.5 951.5 C 879 1024 773 1024 512 1024 C 251 1024 145 1024 72.5 951.5 C 0 879 0 773 0 512 C 0 251 0 145 72.5 72.5 C 145 0 251 0 512 0 Z" fill="none" stroke="url(#squircleRim)" stroke-width="6"/>
    </g>
    <path d="M 512 0 C 773 0 879 0 951.5 72.5 C 1024 145 1024 251 1024 512 C 1024 773 1024 879 951.5 951.5 C 879 1024 773 1024 512 1024 C 251 1024 145 1024 72.5 951.5 C 0 879 0 773 0 512 C 0 251 0 145 72.5 72.5 C 145 0 251 0 512 0 Z" fill="none" stroke="#E0D8C9" stroke-width="4"/>
  </g>
  <path fill="#382F1F" d="M 880.00 346.32 C 869.36 371.24 845.56 405.40 818.68 426.68 L 820.92 429.76 C 857.32 416.32 888.96 392.24 908.00 370.12 C 914.44 371.24 916.96 369.84 918.64 367.04 Z M 987.24 352.48 L 984.72 354.44 C 1004.88 371.80 1027.00 398.68 1035.40 423.04 C 1071.52 445.16 1092.80 371.80 987.24 352.48 Z M 960.92 202.12 C 978.28 244.96 1016.92 276.04 1058.08 296.76 C 1060.32 283.60 1070.40 268.48 1084.96 264.56 L 1085.24 260.08 C 1043.24 249.44 991.44 230.96 965.68 198.76 C 974.92 197.64 978.56 195.96 979.68 192.32 L 928.44 179.16 C 916.40 217.80 864.04 274.92 816.44 304.32 L 818.12 307.40 C 873.28 286.40 933.20 243.28 960.92 202.12 Z M 880.28 279.40 L 882.24 287.52 L 931.52 287.52 L 931.52 326.16 L 832.68 326.16 L 835.20 334.00 L 931.52 334.00 L 931.52 401.20 C 931.52 404.56 930.12 406.52 925.64 406.52 C 919.20 406.52 888.68 404.56 888.68 404.56 L 888.68 408.20 C 904.08 410.44 910.24 414.36 914.72 419.12 C 919.48 424.16 920.88 432.28 921.72 442.92 C 961.20 440.12 967.36 425.00 967.36 402.32 L 967.36 334.00 L 1062.28 334.00 C 1066.48 334.00 1069.28 332.60 1070.12 329.52 C 1057.52 318.32 1036.52 302.92 1036.52 302.92 L 1018.04 326.16 L 967.36 326.16 L 967.36 287.52 L 1011.04 287.52 C 1015.24 287.52 1018.04 286.12 1018.88 283.04 C 1006.84 272.12 986.68 256.72 986.68 256.72 L 969.32 279.40 Z"/>
  <path fill="#382F1F" d="M 1321.48 246.64 L 1321.48 321.96 L 1187.08 321.96 L 1187.08 246.64 Z M 1231.04 178.88 C 1228.80 195.96 1224.32 220.88 1220.12 238.80 L 1189.60 238.80 L 1152.08 223.68 L 1152.08 441.80 L 1157.68 441.80 C 1172.80 441.80 1187.08 433.40 1187.08 429.20 L 1187.08 415.48 L 1321.48 415.48 L 1321.48 440.40 L 1327.08 440.40 C 1340.24 440.40 1356.48 431.16 1356.76 428.36 L 1356.76 253.64 C 1363.76 252.24 1367.96 249.44 1370.48 246.92 L 1335.48 219.20 L 1318.12 238.80 L 1229.36 238.80 C 1244.48 225.36 1259.04 208.28 1269.40 196.24 C 1275.84 196.24 1278.92 194.00 1280.04 190.36 Z M 1187.08 407.36 L 1187.08 329.80 L 1321.48 329.80 L 1321.48 407.36 Z"/>
