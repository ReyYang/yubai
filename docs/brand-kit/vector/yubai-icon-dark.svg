      <stop offset="100%" stop-color="#476846"/>
    </linearGradient>
    <linearGradient id="mossBaseDark" x1="0.15" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#2F422E"/>
      <stop offset="55%" stop-color="#263625"/>
      <stop offset="100%" stop-color="#1B271A"/>
    </linearGradient>
    <linearGradient id="seamDropRight" x1="0" y1="0" x2="1" y2="0">
