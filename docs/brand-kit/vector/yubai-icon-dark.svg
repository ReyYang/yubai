    <path d="M 374 678 C 344 576 366 478 416 398 C 424 498 410 598 383 680 Z" fill="url(#sageLeafDark)"/>
    <path d="M 374 668 C 346 574 367 478 416 398 C 422 482 413 568 390 648" fill="none" stroke="#DCEBD0" stroke-width="2" stroke-opacity="0.82" stroke-linecap="round"/>
    <path d="M 379 668 C 378 584 392 496 414 412" fill="none" stroke="#CFE0C2" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- 4. Primary left spreading leaf (tip 128,576) + sunlit upper-edge rim + midrib vein -->
    <path d="M 372 702 C 282 690 198 640 128 576 C 220 600 308 644 376 690 Z" fill="url(#sageLeafDark)"/>
    <path d="M 128 576 C 218 600 304 642 370 688" fill="none" stroke="#DCEBD0" stroke-width="2.1" stroke-opacity="0.85" stroke-linecap="round"/>
    <path d="M 364 695 C 292 664 216 624 144 584" fill="none" stroke="#CFE0C2" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- 5. Primary right ascending leaf (tip 516,526) + sunlit upper-edge rim + midrib vein -->
    <path d="M 382 714 C 398 638 452 576 516 526 C 492 612 446 690 394 720 Z" fill="url(#sageLeafDark)"/>
    <path d="M 385 704 C 400 634 453 575 516 526 C 495 600 456 668 406 708" fill="none" stroke="#DCEBD0" stroke-width="2" stroke-opacity="0.80" stroke-linecap="round"/>
    <path d="M 392 712 C 424 654 464 594 506 538" fill="none" stroke="#CFE0C2" stroke-width="1.8" stroke-opacity="0.62" stroke-linecap="round"/>
    </g>

    <rect x="626" y="260" width="192" height="76" rx="16" fill="#0A0F0A" opacity="0.48" filter="url(#tabShadow)"/>
    <rect x="617" y="253" width="190" height="74" rx="16" fill="url(#tabGlassDark)" stroke="#E9CF9F" stroke-opacity="0.62" stroke-width="2.2"/>

    <path d="M 512 0 C 773 0 879 0 951.5 72.5 C 1024 145 1024 251 1024 512 C 1024 773 1024 879 951.5 951.5 C 879 1024 773 1024 512 1024 C 251 1024 145 1024 72.5 951.5 C 0 879 0 773 0 512 C 0 251 0 145 72.5 72.5 C 145 0 251 0 512 0 Z" fill="none" stroke="url(#squircleRim)" stroke-width="5"/>
  </g>
  <path d="M 512 0 C 773 0 879 0 951.5 72.5 C 1024 145 1024 251 1024 512 C 1024 773 1024 879 951.5 951.5 C 879 1024 773 1024 512 1024 C 251 1024 145 1024 72.5 951.5 C 0 879 0 773 0 512 C 0 251 0 145 72.5 72.5 C 145 0 251 0 512 0 Z" fill="none" stroke="#3A3428" stroke-width="2.5"/>
