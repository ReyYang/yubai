  <g clip-path="url(#squircleClip)">
    
    <!-- Dark Mode: Obsidian-Sage & Warm Night Window (#1F1B14 / #2A251C / #353026 / #86A884) -->
    <rect width="1024" height="1024" fill="url(#mossBaseDark)"/>
    <g filter="url(#softWindow)">
