name: iOS

# 只手动触发。仓库公开时标准运行器免费；仓库若改回私有，macOS 分钟按 10 倍计，跑之前先问用户。
on:
  workflow_dispatch:
    inputs:
      release_builds:
        description: '同时做 Release 构建（iOS 真机与 macOS，不签名）'
        type: boolean
        default: false
      mode:
        description: 'tests = 单元与 UI 测试；gallery = 只跑逐屏截图；both = 都跑'
        type: choice
        options: [tests, gallery, both]
        default: tests

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    if: inputs.mode != 'gallery'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: 选择 iPhone 模拟器
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                      print(d["udid"]); sys.exit()
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          xcrun simctl list devices | grep "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: 编译并运行单元与 UI 测试
        run: |
          mkdir -p build
          status=0
          xcodebuild -project Yubai.xcodeproj -scheme Yubai -configuration Debug \
            -destination "id=$SIM_UDID" -parallel-testing-enabled NO \
            -resultBundlePath build/Yubai.xcresult CODE_SIGNING_ALLOWED=NO test \
            > build/xcodebuild-test.log 2>&1 || status=$?
          grep -E '(error:|Test Case .* (passed|failed)|Executed|\*\* TEST)' build/xcodebuild-test.log || tail -100 build/xcodebuild-test.log
          exit $status
      - name: 导出截图和测试摘要
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Yubai.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Yubai.xcresult --output-path build/screenshots || true
            xcrun xcresulttool get test-results summary --path build/Yubai.xcresult > build/test-summary.json || true
          fi
          # 按测试里给的名字重命名截图，例如 import-02-import-preview.png
          python3 - <<'PY'
          import json, os, re
          root = "build/screenshots"
          path = os.path.join(root, "manifest.json")
          if os.path.exists(path):
              for test in json.load(open(path)):
                  for a in test.get("attachments", []):
                      name = re.sub(r"_\d+_[0-9A-F-]{36}(\.\w+)?$", r"\1", a.get("suggestedHumanReadableName", ""))
                      # upload-artifact 不接受 " : < > | * ? 等字符；失败时 Xcode 附带的调试文件名里会有
                      name = re.sub(r'[\\"`:<>|*?\r\n/]+', "-", name).strip(" -")
                      src = os.path.join(root, a["exportedFileName"])
                      dst = os.path.join(root, name)
                      n = 2
                      while os.path.exists(dst):
                          base, ext = os.path.splitext(name); dst = os.path.join(root, f"{base}-{n}{ext}"); n += 1
                      if name and os.path.exists(src):
                          os.rename(src, dst)
          PY
          ls build/screenshots
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          try: s = json.load(open("build/test-summary.json"))
          except Exception: s = {}
          print(f"测试结果：{s.get('result', '未知')}，共 {s.get('totalTestCount', '?')} 项，通过 {s.get('passedTests', '?')}，失败 {s.get('failedTests', '?')}，跳过 {s.get('skippedTests', '?')}")
          for f in s.get("testFailures", []):
              print(f"- 失败：{f.get('testIdentifierString', f.get('testName', ''))}：{f.get('failureText', '')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-logs
          path: |
            build/xcodebuild-test.log
            build/test-summary.json
      - name: Release 构建（iOS 与 macOS，不签名）
        if: inputs.release_builds
        run: |
          set -o pipefail
          xcodebuild -project Yubai.xcodeproj -scheme Yubai -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -20
          xcodebuild -project Yubai.xcodeproj -scheme Yubai -configuration Release \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build | tail -20

  gallery:
    if: inputs.mode != 'tests'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: reduced
            walks: testAccessibilityWalk testDarkWalk
          - part: roots
            walks: testWalk01RootsAndLedger testWalk02FormulaAndAccounts
          - part: money
            walks: testWalk03Bills testWalk04Saving testWalk05EntrySheets
          - part: pages
            walks: testWalk06Categories testWalk07Yubai testWalk08Settings
          - part: states
            walks: testWalk09Imports testWalk10States testWalk11Empty
    env:
      GALLERY_ONLY: ${{ matrix.walks }}
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: 选择 iPhone 模拟器
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                      print(d["udid"]); sys.exit()
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          xcrun simctl list devices | grep "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: 逐屏截图
        shell: bash
        run: |
          set -o pipefail
          # Print each test's start and result as it happens so a stall is visible from outside.
          scripts/gallery.sh "$SIM_UDID" 2>&1 | tee gallery-run.log \
            | grep --line-buffered -E "GALLERY-STOP|Test Case|Test Suite|error:|Gallery:|\*\* (BUILD|TEST)" \
            || { tail -80 gallery-run.log; exit 1; }
      - name: 摘要
        if: always()
        run: |
          grep -E "error:|Gallery:|\*\* TEST" gallery-run.log | tail -40 || true
          head -5 .shots/index.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "Missing: $(wc -l < .shots/missing.txt 2>/dev/null || echo '?')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-gallery-${{ matrix.part }}
          path: .shots
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-gallery-log-${{ matrix.part }}
          path: gallery-run.log
