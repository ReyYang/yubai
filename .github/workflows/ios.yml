name: iOS

# 只手动触发。仓库公开时标准运行器免费；仓库若改回私有，macOS 分钟按 10 倍计，跑之前先问用户。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '仅运行此前缀的截图分片；测试保留 Round47 与 unit（空白则运行全部）'
        type: string
        default: ''
      parts:
        description: '仅运行指定分片或 UI 测试类（空格或逗号分隔；空白则沿用全部所选分片）'
        type: string
        default: ''
      release_builds:
        description: '同时做 Release 构建（iOS 真机与 macOS，不签名）'
        type: boolean
        default: false
      diagnostics:
        description: '门禁测试和截图结束后运行诊断分片（parts 显式指定时仍会运行）'
        type: boolean
        default: false
      simslim:
        description: 'Try simslim; failures fall back to the stock simulator'
        type: boolean
        default: false
      mode:
        description: 'tests = 单元与 UI 测试；gallery = 只跑逐屏截图；both = 都跑'
        type: choice
        options: [tests, gallery, both]
        default: tests

env:
  # Owner: fill in an exact simslim release tag before opting in (never latest).
  SIMSLIM_VERSION: 'v0.14.0'
  SIMSLIM_BOOT_TIMEOUT: '300s'

concurrency:
  group: ${{ inputs.parts != '' && format('ios-parts-{0}-{1}', github.ref, inputs.parts) || format('ios-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test-shards:
    # 所有 mode 都先校验两套分片的共同名称，避免拼错后静默跳过。
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      has-shards: ${{ steps.shards.outputs.has-shards }}
      gate-matrix: ${{ steps.shards.outputs.gate-matrix }}
      has-gate-shards: ${{ steps.shards.outputs.has-gate-shards }}
      diagnostic-matrix: ${{ steps.shards.outputs.diagnostic-matrix }}
      has-diagnostic-shards: ${{ steps.shards.outputs.has-diagnostic-shards }}
    steps:
      - uses: actions/checkout@v4
      - id: shards
        name: 校验分片名称并生成测试分片
        env:
          YUBAI_TEST_ONLY: ${{ inputs.only }}
          YUBAI_TEST_PARTS: ${{ inputs.parts }}
          YUBAI_DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: python3 scripts/ui-test-shards.py --only "$YUBAI_TEST_ONLY" --parts "$YUBAI_TEST_PARTS" --diagnostics "$YUBAI_DIAGNOSTICS" --validate-parts --github-output >> "$GITHUB_OUTPUT"

  simulator-build:
    # gallery-shards is skipped in tests mode; still build selected tests once.
    if: >-
      always() && !cancelled() && needs.test-shards.result == 'success' &&
      (inputs.mode == 'tests' || needs.gallery-shards.result == 'success') &&
      ((inputs.mode != 'gallery' && needs.test-shards.outputs.has-shards == 'true') ||
       (inputs.mode != 'tests' && needs.gallery-shards.outputs.has-shards == 'true'))
    needs: [test-shards, gallery-shards]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - &select-xcode
        name: 选择 Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: 编译共享模拟器测试产物
        timeout-minutes: 34
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing -project Yubai.xcodeproj -scheme Yubai -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build/xcodebuild-build.log | tail -80
      - name: 校验可迁移路径并打包（保留权限、符号链接与 dSYM）
        run: |
          python3 scripts/prebuilt_simulator.py build/DerivedData --record
          COPYFILE_DISABLE=1 tar -czf build/simulator-products.tar.gz -C build/DerivedData Build/Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/simulator-products.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-build-log
          path: build/xcodebuild-build.log
          retention-days: 2

  simulator:
    if: >-
      always() && !cancelled() && inputs.mode != 'gallery' &&
      needs.test-shards.outputs.has-gate-shards == 'true' &&
      needs.simulator-build.result == 'success'
    needs: [test-shards, simulator-build]
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-shards.outputs.gate-matrix) }}
    env: &simulator-env
      YUBAI_TEST_PART: ${{ matrix.part }}
      YUBAI_TEST_SELECTORS: ${{ toJSON(matrix.tests) }}
      YUBAI_LIVE_EVAL: '0'
      YUBAI_PREBUILT_DERIVED_DATA: build/DerivedData
    steps: &simulator-steps
      - uses: actions/checkout@v4
      - *select-xcode
      - &download-prebuilt
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-build
          path: build/prebuilt-artifact
      - &restore-prebuilt
        name: 解包并校验共享测试产物
        run: |
          mkdir -p "$YUBAI_PREBUILT_DERIVED_DATA"
          tar -xzf build/prebuilt-artifact/simulator-products.tar.gz -C "$YUBAI_PREBUILT_DERIVED_DATA"
          python3 scripts/prebuilt_simulator.py "$YUBAI_PREBUILT_DERIVED_DATA"
      - name: 选择 iPhone 模拟器
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                      print(d["udid"]); sys.exit()
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          xcrun simctl list devices | grep "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - &prepare-simslim
        name: Optional simslim
        if: inputs.simslim
        continue-on-error: true
        run: python3 scripts/prepare-simulator-simslim.py
      - name: 运行当前测试分片（使用共享产物）
        timeout-minutes: 34
        run: |
          mkdir -p build
          date +%s > build/test-started-at
          status=0
          python3 scripts/run-simulator-tests.py || status=$?
          grep -E '(error:|Test Case .* (passed|failed)|Executed|\*\* TEST)' build/xcodebuild-test.log || tail -100 build/xcodebuild-test.log
          exit $status
      - name: 导出截图和测试摘要
        if: always()
        run: |
          mkdir -p build/screenshots
          stall_status=0
          stall_since=0
          if [ -f build/test-started-at ]; then stall_since=$(cat build/test-started-at); fi
          python3 scripts/export-stall-records.py --simulator "$SIM_UDID" --output build/stalls --derived-data build/DerivedData --log build/xcodebuild-test.log --since "$stall_since" || stall_status=$?
          python3 scripts/export-crash-reports.py --output build/crashes --since "$stall_since" || true
          if [ -d build/Yubai.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Yubai.xcresult --output-path build/screenshots || true
            xcrun xcresulttool get test-results summary --path build/Yubai.xcresult > build/test-summary.json || true
          fi
          # 按测试里给的名字重命名截图，例如 import-02-import-preview.png
          python3 - <<'PY'
          import json, os, re
          root = "build/screenshots"
          path = os.path.join(root, "manifest.json")
          if os.path.exists(path):
              for test in json.load(open(path)):
                  for a in test.get("attachments", []):
                      name = re.sub(r"_\d+_[0-9A-F-]{36}(\.\w+)?$", r"\1", a.get("suggestedHumanReadableName", ""))
                      # upload-artifact 不接受 " : < > | * ? 等字符；失败时 Xcode 附带的调试文件名里会有
                      name = re.sub(r'[\\"`:<>|*?\r\n/]+', "-", name).strip(" -")
                      src = os.path.join(root, a["exportedFileName"])
                      dst = os.path.join(root, name)
                      n = 2
                      while os.path.exists(dst):
                          base, ext = os.path.splitext(name); dst = os.path.join(root, f"{base}-{n}{ext}"); n += 1
                      if name and os.path.exists(src):
                          os.rename(src, dst)
          PY
          ls build/screenshots
          set -o pipefail
          python3 scripts/test-result-summary.py | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$stall_status" != 0 ]; then echo "::warning::卡顿记录导出失败（不影响测试结论）"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.part }}
          path: build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-logs-${{ matrix.part }}
          path: |
            build/xcodebuild-test.log
            build/test-summary.json
            build/test-exit-status
            build/stalls
            build/crashes
      - name: Release 构建（iOS 与 macOS，不签名）
        if: inputs.release_builds && matrix.part == 'unit'
        run: |
          set -o pipefail
          xcodebuild -project Yubai.xcodeproj -scheme Yubai -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -20
          xcodebuild -project Yubai.xcodeproj -scheme Yubai -configuration Release \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build | tail -20

  simulator-diagnostics:
    name: ${{ matrix.part }}
    if: >-
      always() && !cancelled() && inputs.mode != 'gallery' &&
      needs.test-shards.outputs.has-diagnostic-shards == 'true' &&
      needs.simulator-build.result == 'success'
    needs: [test-shards, simulator-build, simulator, gallery]
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-shards.outputs.diagnostic-matrix) }}
    # Keep real failed jobs and the same logs/screenshots; only the gate is required.
    env: *simulator-env
    steps: *simulator-steps

  # Required merge status: diagnostics are reported separately, never folded into it.
  simulator-results:
    if: always()
    needs: [test-shards, simulator-build, simulator, simulator-diagnostics, gallery-shards, gallery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: 所有门禁分片必须完成
        env:
          MODE: ${{ inputs.mode }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          TESTS_RESULT: ${{ needs.simulator.result }}
          TESTS_HAS_SHARDS: ${{ needs.test-shards.outputs.has-gate-shards }}
          GALLERY_SHARDS_RESULT: ${{ needs.gallery-shards.result }}
          GALLERY_RESULT: ${{ needs.gallery.result }}
          GALLERY_HAS_SHARDS: ${{ needs.gallery-shards.outputs.has-shards }}
        run: |
          echo "测试分片：$SHARDS_RESULT / $TESTS_RESULT；截图分片：$GALLERY_SHARDS_RESULT / $GALLERY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$SHARDS_RESULT" = success
          if [ "$MODE" != gallery ]; then
            if [ "$TESTS_HAS_SHARDS" = true ]; then
              test "$TESTS_RESULT" = success
            else
              test "$TESTS_HAS_SHARDS" = false
              test "$TESTS_RESULT" = skipped
            fi
          fi
          if [ "$MODE" != tests ]; then
            test "$GALLERY_SHARDS_RESULT" = success
            if [ "$GALLERY_HAS_SHARDS" = true ]; then
              test "$GALLERY_RESULT" = success
            else
              test "$GALLERY_HAS_SHARDS" = false
              test "$GALLERY_RESULT" = skipped
            fi
          fi

      - name: Non-blocking diagnostics
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          DIAGNOSTIC_MATRIX: ${{ needs.test-shards.outputs.diagnostic-matrix }}
          DIAGNOSTICS_RESULT: ${{ needs.simulator-diagnostics.result }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnostic-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: 共享编译必须完成
        if: always()
        env:
          BUILD_RESULT: ${{ needs.simulator-build.result }}
          BUILD_REQUIRED: ${{ (inputs.mode != 'gallery' && needs.test-shards.outputs.has-shards == 'true') || (inputs.mode != 'tests' && needs.gallery-shards.outputs.has-shards == 'true') }}
        run: |
          echo "共享编译：$BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi

  gallery-shards:
    if: inputs.mode != 'tests'
    needs: test-shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      has-shards: ${{ steps.shards.outputs.has-shards }}
    steps:
      - uses: actions/checkout@v4
      - id: shards
        name: 从源码生成截图分片
        env:
          YUBAI_TEST_ONLY: ${{ inputs.only }}
          YUBAI_TEST_PARTS: ${{ inputs.parts }}
        run: python3 scripts/gallery-shards.py --only "$YUBAI_TEST_ONLY" --parts "$YUBAI_TEST_PARTS" --github-output >> "$GITHUB_OUTPUT"
      - name: 检查界面与逐屏覆盖
        if: steps.shards.outputs.has-shards == 'true'
        run: bash scripts/check-ui-consistency.sh

  gallery:
    if: >-
      always() && !cancelled() && inputs.mode != 'tests' &&
      needs.gallery-shards.outputs.has-shards == 'true' &&
      needs.simulator-build.result == 'success'
    needs: [gallery-shards, simulator-build]
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gallery-shards.outputs.matrix) }}
    env:
      GALLERY_ONLY: ${{ matrix.walks }}
      YUBAI_PREBUILT_DERIVED_DATA: build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - *select-xcode
      - *download-prebuilt
      - *restore-prebuilt
      - name: 选择 iPhone 模拟器
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                      print(d["udid"]); sys.exit()
          for r in runtimes:
              for d in devices[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          xcrun simctl list devices | grep "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - *prepare-simslim
      - name: 逐屏截图
        shell: bash
        run: |
          set -o pipefail
          # Print each test's start and result as it happens so a stall is visible from outside.
          scripts/gallery.sh "$SIM_UDID" 2>&1 | tee gallery-run.log \
            | grep --line-buffered -E "GALLERY-STOP|Test Case|Test Suite|error:|Gallery:|\*\* (BUILD|TEST)" \
            || { tail -80 gallery-run.log; exit 1; }
      - name: 摘要
        if: always()
        run: |
          grep -E "error:|Gallery:|\*\* TEST" gallery-run.log | tail -40 || true
          head -5 .shots/index.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "Missing: $(wc -l < .shots/missing.txt 2>/dev/null || echo '?')" >> "$GITHUB_STEP_SUMMARY"
      - name: 导出崩溃报告
        if: always()
        run: |
          crash_since=0
          if [ -f .shots/run-started-at ]; then crash_since=$(cat .shots/run-started-at); fi
          python3 scripts/export-crash-reports.py --output .shots/crashes --since "$crash_since" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-gallery-${{ matrix.part }}
          path: .shots
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-gallery-log-${{ matrix.part }}
          path: gallery-run.log
