  <div style="width: 40px; height: 5px; border-radius: 3px; background: var(--grabber, #d8cfbe); align-self: center"></div>

    <span style="font-size: 15px; font-weight: 500">添加安排</span>
    <a href="P-Plans.dc.html" style="justify-self: end; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--brand, #557f53); color: var(--on-brand, #ffffff); display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 500">保存</a>
  </div>

  <div style="margin-top: 16px; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: var(--brand-tint, #d6e2cc); color: var(--brand-tint-strong, #2f4a2e); font-size: 13px"><svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke-width="10" style="stroke: var(--brand-glyph, #3f6a3e)"></circle><path d="M22 52c7-9 14-9 19 0s12 9 19 0 12-9 19 0" fill="none" stroke-width="10" stroke-linecap="round" style="stroke: var(--brand-glyph, #3f6a3e)"></path></svg>按过去 6 次扣款填好了，改改就行</div>

  <div role="tablist" aria-label="类型" style="margin-top: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 18px; background: var(--card, #ede6d3)">
    <button role="tab" aria-selected="true" style="flex: 1; height: 32px; border-radius: 14px; border: 0; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: inherit; font-size: 13px; font-weight: 500">要付</button>
    <button role="tab" style="flex: 1; height: 32px; border-radius: 14px; border: 0; background: transparent; color: var(--label-muted, #5a5040); font-family: inherit; font-size: 13px">要收</button>
  </div>

  <div style="margin-top: 12px; border-radius: 22px; background: var(--card, #ede6d3); padding: 6px 18px">

    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-top: 1px solid var(--separator, #e0d8c9); font-size: 14px"><span>名字</span><input value="爱奇艺会员" aria-label="名字" style="flex: 1; min-width: 0; text-align: right; border: 0; background: transparent; font-family: inherit; font-size: 14px; color: var(--label, #382f1f); outline: none"></label>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-top: 1px solid var(--separator, #e0d8c9); font-size: 14px"><span>多久一次</span><span style="height: 30px; padding: 0 12px; border-radius: 15px; background: var(--raised, #fefbea); display: flex; align-items: center; font-size: 13px">每月 18 日</span></div>

    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-top: 1px solid var(--separator, #e0d8c9); font-size: 14px"><span>到什么时候</span><span style="height: 30px; padding: 0 12px; border-radius: 15px; background: var(--raised, #fefbea); display: flex; align-items: center; font-size: 13px">一直</span></div>
  </div>

  <div style="margin-top: 12px; border-radius: 22px; background: var(--card, #ede6d3); padding: 16px 18px 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 500">90 天里会先留出</span><span style="font-family: var(--font-num, 'Geist', sans-serif); font-size: 16px; font-weight: 600">75</span></div>
    <svg width="318" height="44" viewBox="0 0 318 44" role="img" aria-label="接下来 90 天扣 3 次：10 月 18 日、11 月 18 日、12 月 18 日" style="margin-top: 10px; display: block">
      <line x1="0" y1="14" x2="318" y2="14" stroke-width="1" style="stroke: var(--chart-rule, #b9ac93)"></line>
      <g stroke-width="2" style="fill: var(--brand, #557f53); stroke: var(--card, #ede6d3)"><circle cx="7.1" cy="14" r="6"></circle><circle cx="116.6" cy="14" r="6"></circle><circle cx="222.6" cy="14" r="6"></circle></g>
      <g font-family="Noto Sans SC" font-size="10" text-anchor="middle" style="fill: var(--label-secondary, #6a604f)"><text x="12" y="38">10/18</text><text x="116.6" y="38">11/18</text><text x="222.6" y="38">12/18</text><text x="300" y="38">1/14</text></g>
    </svg>
  </div>

  <div style="margin-top: auto; text-align: center; font-size: 11px; color: var(--label-secondary, #6a604f)">扣款到账后，会自动和这条安排对上。</div>
</div>
