<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记一笔 · 数字键盘</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yubai/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Noto+Serif+SC:wght@600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 18px 24px; background: var(--canvas, #f5f1e5); color: var(--label, #382f1f); font-family: var(--font-sans, 'Noto Sans SC', sans-serif); display: flex; flex-direction: column">
  <div style="width: 40px; height: 5px; border-radius: 3px; background: var(--grabber, #d8cfbe); align-self: center"></div>
  <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px">
    <a href="V4-Home.dc.html" style="justify-self: start; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--card, #ede6d3); color: var(--label, #382f1f); display: flex; align-items: center; text-decoration: none; font-size: 14px">取消</a>
    <span style="font-size: 15px; font-weight: 500">记一笔</span>
    <a href="V5-Import-Pick.dc.html" aria-label="从截图或账单文件导入" style="justify-self: end; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--card, #ede6d3); color: var(--label, #382f1f); display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m20 15-4-4-8 8"></path></svg>导入</a>
  </div>

  <div role="tablist" aria-label="性质" style="margin-top: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 18px; background: var(--card, #ede6d3)">
    <button role="tab" aria-selected="true" style="flex: 1; height: 32px; border-radius: 14px; border: 0; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: inherit; font-size: 13px; font-weight: 500">支出</button>
    <button role="tab" aria-selected="false" style="flex: 1; height: 32px; border-radius: 14px; border: 0; background: transparent; color: var(--label-muted, #5a5040); font-family: inherit; font-size: 13px">收入</button>
    <button role="tab" aria-selected="false" style="flex: 1; height: 32px; border-radius: 14px; border: 0; background: transparent; color: var(--label-muted, #5a5040); font-family: inherit; font-size: 13px">转账</button>
  </div>

  <div style="margin-top: 12px; display: flex; align-items: baseline; gap: 6px; min-height: 60px; padding: 0 4px">
    <span style="font-family: var(--font-num, 'Geist', sans-serif); font-size: 24px; color: var(--label-secondary, #6a604f)">¥</span>
    <span aria-label="金额 32" style="font-family: var(--font-num, 'Geist', sans-serif); font-size: 44px; line-height: 52px; font-weight: 600; letter-spacing: -1px; font-variant-numeric: tabular-nums">32</span>
    <span aria-hidden="true" style="width: 2px; height: 36px; align-self: center; background: var(--brand, #557f53)"></span>
  </div>

  <div role="radiogroup" aria-label="分类" style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px">
    <button role="radio" aria-checked="true" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--selected, #e3dac6); color: var(--label, #382f1f); font-family: inherit; font-size: 13px; font-weight: 500; box-shadow: inset 0 0 0 1.5px var(--brand, #557f53)">餐饮</button>
    <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: inherit; font-size: 13px">交通</button>
    <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: inherit; font-size: 13px">日用</button>
    <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: inherit; font-size: 13px">购物</button>
    <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: inherit; font-size: 13px">娱乐</button>
    <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: transparent; color: var(--label-muted, #5a5040); font-family: inherit; font-size: 13px; box-shadow: inset 0 0 0 1px var(--grabber, #d8cfbe)">更多</button>
  </div>

  <div style="margin-top: 12px; border-radius: 22px; background: var(--card, #ede6d3); padding: 2px 18px">
    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; font-size: 14px">
      <span>用途</span><input placeholder="午饭、打车…（可不填）" value="午饭" aria-label="用途" style="flex: 1; min-width: 0; text-align: right; border: 0; background: transparent; font-family: inherit; font-size: 14px; color: var(--label, #382f1f); outline: none">
    </label>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 46px; border-top: 1px solid var(--separator, #e0d8c9); font-size: 14px">
      <span>账户</span><button style="height: 30px; padding: 0 12px; border-radius: 15px; border: 0; background: var(--raised, #fefbea); font-family: inherit; font-size: 13px; color: var(--label, #382f1f)">微信零钱 · 余额 1,250</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 46px; border-top: 1px solid var(--separator, #e0d8c9); font-size: 14px">
      <span>日期</span><button style="height: 30px; padding: 0 12px; border-radius: 15px; border: 0; background: var(--raised, #fefbea); font-family: inherit; font-size: 13px; color: var(--label, #382f1f)">今天</button>
    </div>
  </div>

  <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; font-size: 12px; color: var(--label-secondary, #6a604f)">
    <span>记下后，还能自在支配</span>
    <span style="font-family: var(--font-num, 'Geist', sans-serif); font-size: 14px; font-weight: 600; color: var(--label, #382f1f); font-variant-numeric: tabular-nums">¥12,448</span>
  </div>

  <div aria-label="数字键盘" style="margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 52px; gap: 6px">
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">1</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">2</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">3</button>
    <button aria-label="删除一位" style="border: 0; border-radius: 14px; background: var(--card, #ede6d3); color: var(--label, #382f1f); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="m12 9 6 6M18 9l-6 6"></path></svg></button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">4</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">5</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">6</button>
    <button aria-label="加" style="border: 0; border-radius: 14px; background: var(--card, #ede6d3); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">+</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">7</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">8</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">9</button>
    <button aria-label="减" style="border: 0; border-radius: 14px; background: var(--card, #ede6d3); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">−</button>
    <button aria-label="小数点" style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">.</button>
    <button style="border: 0; border-radius: 14px; background: var(--raised, #fefbea); color: var(--label, #382f1f); font-family: var(--font-num, 'Geist', sans-serif); font-size: 22px">0</button>
    <a href="V4-Home-Saved.dc.html" style="grid-column: span 2; border-radius: 14px; background: var(--brand, #557f53); color: var(--on-brand, #ffffff); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 500">记下 32 元</a>
  </div>
  <button style="margin-top: 8px; height: 40px; border: 0; background: transparent; color: var(--label-muted, #5a5040); font-family: inherit; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px">记下，再记一笔</button>
</div>
</x-dc>
