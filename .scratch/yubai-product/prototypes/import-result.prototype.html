<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'">
<title>余白 · 导入结果交互草稿</title>
<style>
:root{color-scheme:light;--ink:#25392f;--muted:#67736b;--line:#e0e5de;--green:#315d48;--pale:#edf3eb;--paper:#fbfcf8}
*{box-sizing:border-box}body{margin:0;background:#f1f2ec;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65}
button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:white;color:var(--ink);text-align:left}button:hover:not(:disabled){background:#edf3eb}button:focus-visible,select:focus-visible{outline:3px solid #91b49d;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green);text-align:center}button.primary:hover{background:#254a38}button.link{padding:3px 0;border:0;border-radius:0;background:transparent;color:var(--green);text-decoration:underline;text-underline-offset:4px}
h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-.6px;line-height:1.3}h2{font-size:21px}h3{font-size:16px}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:10px}.intro{max-width:1120px;margin:36px auto 24px;padding:0 24px}.intro p{max-width:760px;margin-top:10px}.workspace{max-width:1120px;margin:0 auto 40px;padding:0 24px;display:grid;grid-template-columns:minmax(310px,440px) minmax(330px,1fr);gap:40px;align-items:start}.phone{background:var(--paper);border:1px solid #d7ded5;border-radius:26px;padding:26px;box-shadow:0 12px 34px #233e2810;min-height:690px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-weight:650;font-size:18px;letter-spacing:3px}.badge{font-size:12px;background:var(--pale);color:var(--green);border-radius:30px;padding:3px 10px}.hero{padding-bottom:26px}.hero h1{font-size:32px}.hero p{margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric strong{display:block;font-size:25px;font-weight:550;line-height:1.35}.metric span{font-size:12px;color:var(--muted)}.section{padding:22px 0;border-bottom:1px solid var(--line)}.section p{margin:6px 0 10px}.quiet{background:var(--pale);padding:16px;border-radius:14px;margin-top:20px}.quiet p{margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:grid;gap:10px;margin-top:22px}.actions .primary{padding:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.choices button{text-align:center;font-size:14px}.choices button.selected{border-color:var(--green);background:var(--pale)}.back{margin-bottom:22px}.txn{padding:14px 0;border-bottom:1px solid var(--line)}.txn strong{font-weight:600}.txn p{margin:3px 0 8px}.txn select{width:100%;padding:10px;background:white;border:1px solid var(--line);border-radius:9px;color:var(--ink)}.notice{padding:10px 12px;border-radius:10px;background:var(--pale);font-size:13px;margin-top:15px}.lab{padding-top:3px}.lab>section{margin-bottom:26px}.lab h2{font-size:17px;margin-bottom:10px}.lab p{margin:6px 0 12px}.state{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:13px;overflow:hidden}.state div{padding:12px 16px;background:#fafbf7}.state dt{font-size:12px;color:var(--muted)}.state dd{margin:3px 0 0;font-size:14px}.free{display:flex;flex-wrap:wrap;gap:8px}.free button{font-size:13px}.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{font-size:13px;padding:7px 10px}.tabs button[aria-selected=true]{background:var(--green);color:white;border-color:var(--green)}.walk{border:1px solid var(--line);padding:16px;border-radius:13px;margin-top:10px;background:#fafbf7}.steps{display:grid;gap:8px}.steps button{font-size:14px}.footer{font-size:12px;color:var(--muted);margin-top:22px}.preview-label{margin:0 0 12px 8px;font-size:12px;color:var(--muted)}#status{min-height:25px;margin-top:12px;font-size:13px;color:var(--green)}
@media(max-width:820px){.workspace{grid-template-columns:minmax(0,1fr);max-width:540px;gap:28px}.intro{max-width:540px;margin-top:24px}.intro h1{font-size:23px}.phone{min-height:0;padding:23px}.lab{padding:0 4px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="intro"><div class="eyebrow">余白 / 可丢弃的交互草稿</div><h1>账单整理完，就可以离开了吗？</h1><p class="muted">体验四千条记录自动整理后的流程：直接结束、稍后补充用途，或一次纠正一组分类。这里验证的是操作是否省事，视觉风格与资金计算尚未定稿。</p></header>
<main class="workspace">
<div><p class="preview-label">应用内的示例体验</p><section class="phone" id="app" aria-label="导入结果预演"></section></div>
<aside class="lab" aria-label="预演控制台">
<section><h2>当前情况</h2><dl id="state" class="state"></dl><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>自由试一试</h2><div class="free"><button data-action="RESET">重置示例</button><button data-action="PERFECT">试试没有疑问</button><button data-action="HOME">先离开，不处理</button><button data-action="REOPEN">重新查看导入</button><button data-action="OPEN_OTHER">查看其他支出</button><button data-action="UNDO" id="undo">撤销上次分类修改</button></div></section>
<section><h2>跟着场景走一遍</h2><div id="tabs" class="tabs" role="tablist" aria-label="预演场景"></div><div id="walk" class="walk" role="tabpanel"></div></section>
<p class="footer">所有数据均为虚构。4,000 是示例总数，仅展开少量代表记录；不代表 AI 正确率或真实处理性能。本文件不读取账单，不调用 AI 或网络，不保存数据。关闭或刷新即重置。</p>
</aside>
</main>
<script>
// Pure state module: no DOM, network, storage or actual financial processing.
const ImportDemo=(()=>{
  const start=()=>({page:'result',panel:null,answers:[null,null],other:null,history:[],split:false,message:'示例账单已整理；无需逐条确认。'});
  const snapshot=s=>({answers:[...s.answers],other:s.other});
  const counts=s=>({known:3972+(s.other?26:0)+s.answers.filter(Boolean).length,other:s.other?0:26,unknown:s.answers.filter(x=>!x).length});
  function reduce(s,a){
    if(a.type==='RESET')return start();
    if(a.type==='PERFECT')return {...start(),answers:['房租分摊','房租分摊'],other:'日用购物',message:'切换为全部类别与用途均已明确的示例。'};
    if(a.type==='HOME')return {...s,page:'home',panel:null,message:'已返回总览；未补充的用途仍保留，没有阻止导入完成。'};
    if(a.type==='REOPEN'||a.type==='BACK')return {...s,page:'result',panel:null,message:'导入记录仍在，可以随时查看或补充。'};
    if(a.type==='OPEN_OTHER')return {...s,page:'result',panel:'other',message:'这组普通支出可以一直保留在“其他支出”。'};
    if(a.type==='OPEN_QUESTIONS')return {...s,page:'result',panel:'questions',message:'可以整组补充，也可以分别选择；可以稍后再说。'};
    if(a.type==='OPEN_RECORDS')return {...s,page:'result',panel:'records',message:'这里只展示少量示例摘要，不需要逐条审核。'};
    if(a.type==='SPLIT')return {...s,split:!s.split};
    if(a.type==='ANSWER')return {...s,history:[...s.history,snapshot(s)],answers:s.answers.map((v,i)=>a.index===undefined||a.index===i?a.value:v),message:a.index===undefined?'两笔记录已按你的补充更新；金额没有改变。':'这笔记录已按你的补充更新；另一笔保持原状。'};
    if(a.type==='CATEGORY')return {...s,history:[...s.history,snapshot(s)],other:a.value,message:'26 笔示例记录已一起修改分类，可以撤销。'};
    if(a.type==='UNDO'&&s.history.length){const previous=s.history[s.history.length-1];return {...s,...previous,history:s.history.slice(0,-1),message:'已撤销上次分类修改；金额和总笔数保持不变。'};}
    return s;
  }
  return {start,counts,reduce};
})();

const scenarios=[
 {title:'直接结束',description:'有“其他支出”，也有用途未知的转账。看看它们会不会挡住你离开。',steps:[['返回总览',{type:'HOME'}],['再回来查看',{type:'REOPEN'}]]},
 {title:'补充一句',description:'两笔转账其实都是房租分摊。一次补充就能处理这一组，也可以改成分别处理。',steps:[['查看两笔转账',{type:'OPEN_QUESTIONS'}],['一起归为房租分摊',{type:'ANSWER',value:'房租分摊'}],['完成并离开',{type:'HOME'}]]},
 {title:'批量改与撤销',description:'把这组“其他支出”改为日用购物，再撤销。确认纠正不需要逐笔修改。',steps:[['查看其他支出',{type:'OPEN_OTHER'}],['26 笔一起改为日用购物',{type:'CATEGORY',value:'日用购物'}],['撤销刚才的修改',{type:'UNDO'}]]}
];
let state=ImportDemo.start(),walkIndex=0,stepIndex=0;
const number=n=>n.toLocaleString('zh-CN');
const options=['房租分摊','生日礼金','借款到账','退款'];
function metrics(){const c=ImportDemo.counts(state);return `<div class="metrics"><div class="metric"><strong>${number(c.known)}</strong><span>已明确分类 / 用途</span></div><div class="metric"><strong>${c.other}</strong><span>其他支出</span></div><div class="metric"><strong>${c.unknown}</strong><span>用途暂不明确</span></div></div>`;}
function header(){return '<div class="topline"><span class="brand">余白</span><span class="badge">示例数据</span></div>';}
function renderApp(){
 const c=ImportDemo.counts(state),app=document.getElementById('app');let body=header();
 if(state.page==='home'){
  body+=`<div class="hero"><div class="eyebrow">总览 · 示例状态</div><h1>账本已更新</h1><p class="muted">本次整理已完成。你可以离开，也可以接着问余白。</p></div>${metrics()}<div class="section"><h3>资金进出已记录</h3><p class="muted">${c.unknown?`还有 ${c.unknown} 笔入账用途未明确，暂未归为收入。以后需要分析这部分资金时，可以再补充。`:'两笔示例入账的用途已经补充。'}</p></div><div class="section"><h3>之后想调整，随时回来</h3><p class="muted">“其他支出”也保留在账本中，不需要清空它才能继续使用。</p></div><div class="actions"><button class="primary" data-action="REOPEN">查看这次导入</button></div>`;
 }else if(state.panel==='questions'){
  body+=`<button class="link back" data-action="BACK">返回整理结果</button><h2>这两笔钱是做什么的？</h2><p class="muted small">相似的转账放在一起问，不代表它们一定属于同一用途。</p><div class="txn"><div class="row"><span>9 月 4 日 · 转账入账</span><strong>+ ¥1,000</strong></div><p class="muted small">${state.answers[0]||'用途暂不明确'}</p></div><div class="txn"><div class="row"><span>9 月 12 日 · 转账入账</span><strong>+ ¥1,000</strong></div><p class="muted small">${state.answers[1]||'用途暂不明确'}</p></div>`;
  if(state.split){body+=state.answers.map((v,i)=>`<div class="txn"><label for="purpose-${i}">第 ${i+1} 笔用途</label><select id="purpose-${i}" data-purpose="${i}"><option value="">暂不明确</option>${options.map(o=>`<option${v===o?' selected':''}>${o}</option>`).join('')}</select></div>`).join('');}
  else body+=`<p class="small muted" style="margin-top:15px">如果两笔用途相同，可以一起选择：</p><div class="choices">${options.map(o=>`<button data-answer="${o}" class="${state.answers.every(v=>v===o)?'selected':''}">${o}</button>`).join('')}</div>`;
  body+=`<div class="actions"><button class="link" data-action="SPLIT">${state.split?'一起处理':'两笔用途不同，分别处理'}</button><button class="primary" data-action="BACK">${c.unknown?'稍后再说，返回结果':'返回整理结果'}</button></div><p class="footer">这些选择用于演示交互；尚未实现完整的房租、债务或退款关联。</p>`;
 }else if(state.panel==='other'){
  body+=`<button class="link back" data-action="BACK">返回整理结果</button><h2>${state.other||'其他支出'}</h2><p class="muted">26 笔示例记录 · 共 ¥286</p><div class="quiet"><h3>保留在这里也没关系</h3><p class="small muted">已经确定是支出，只是没有细分用途。不会反复提醒你处理。</p></div><div class="section"><p>这组记录可能属于哪个类别？</p><div class="choices">${['日用购物','餐饮','娱乐旅行'].map(o=>`<button data-category="${o}" class="${state.other===o?'selected':''}">一起改为${o}</button>`).join('')}</div></div><div class="actions"><button data-action="UNDO" ${state.history.length?'':'disabled'}>撤销上次分类修改</button><button class="primary" data-action="BACK">返回整理结果</button></div><p class="footer">这里用一组虚构记录演示批量修改，不代表它们已经过真实识别。</p>`;
 }else if(state.panel==='records'){
  body+=`<button class="link back" data-action="BACK">返回整理结果</button><h2>分类概览</h2><p class="muted small">仅列出用于讨论的代表记录，不是完整四千条明细。</p>${[['早餐','餐饮','− ¥18'],['收到生日礼金','礼金赠与','+ ¥500'],['银行卡转入零钱','自有账户间转账','¥800'],['信用卡还款','还款','− ¥1,200']].map(r=>`<div class="txn"><div class="row"><strong>${r[0]}</strong><span>${r[2]}</span></div><span class="muted small">${r[1]}</span></div>`).join('')}<div class="actions"><button data-action="OPEN_OTHER">查看可批量修改的示例</button><button class="primary" data-action="BACK">返回整理结果</button></div>`;
 }else{
  body+=`<div class="hero"><div class="eyebrow">微信 · 支付宝 · 银行卡</div><h1>账单已整理</h1><p class="muted">3 份示例账单，共 4,000 条记录。<br>你不用逐笔确认。</p></div>${metrics()}<div class="section"><div class="row"><h3>分类结果已经放好</h3><button class="link small" data-action="OPEN_RECORDS">查看</button></div><p class="muted small">${c.other?'26 笔普通支出暂放在“其他”，可以直接保留。':'有明确用途的记录已放入相应分类。'}</p>${c.other?'<button class="link small" data-action="OPEN_OTHER">需要时再调整其他支出</button>':''}</div>${c.unknown?`<div class="quiet"><h3>有 ${c.unknown} 笔转账，补一句会更清楚</h3><p class="muted small">已记录资金流入，暂未归为收入。现在不处理，也可以完成。</p><button class="link small" data-action="OPEN_QUESTIONS">补充用途</button></div>`:'<div class="quiet"><h3>没有需要补充的用途</h3><p class="muted small">发现不合适的分类时，仍可以回来修改。</p></div>'}<div class="actions"><button class="primary" data-action="HOME">完成，返回总览</button></div><p class="footer">示例账单覆盖的日期只是记录范围，不会建立固定结算周期。</p>`;
 }
 app.innerHTML=body;
}
function render(){
 renderApp();const c=ImportDemo.counts(state);
 const fields=[['导入状态','已完成 · 4,000 条'],['正在查看',state.page==='home'?'总览':({questions:'补充用途',other:'批量修改',records:'分类概览'}[state.panel]||'整理结果')],['其他支出',`${c.other} 笔`],['未知用途',`${c.unknown} 笔`],['第 1 笔入账',state.answers[0]||'暂不明确'],['第 2 笔入账',state.answers[1]||'暂不明确'],['示例支出组',state.other||'其他支出'],['可撤销修改',`${state.history.length} 次`]];
 document.getElementById('state').innerHTML=fields.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
 document.getElementById('status').textContent=state.message;document.getElementById('undo').disabled=!state.history.length;
 document.getElementById('tabs').innerHTML=scenarios.map((s,i)=>`<button role="tab" aria-selected="${walkIndex===i}" aria-controls="walk" id="tab-${i}" data-scenario="${i}">${s.title}</button>`).join('');
 const scenario=scenarios[walkIndex],walk=document.getElementById('walk');walk.setAttribute('aria-labelledby',`tab-${walkIndex}`);
 walk.innerHTML=`<p class="small muted">${scenario.description}</p><div class="steps">${scenario.steps.map(([label],i)=>`<button data-step="${i}" ${i===stepIndex?'':'disabled'}>${i<stepIndex?'已体验':`步骤 ${i+1}`} · ${label}</button>`).join('')}</div>${stepIndex===scenario.steps.length?'<p class="small">场景已走完。点击上方场景名称可以重新开始。</p>':''}`;
}
function dispatch(a){state=ImportDemo.reduce(state,a);render();}
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button||button.disabled)return;
 if(button.dataset.scenario!==undefined){walkIndex=Number(button.dataset.scenario);stepIndex=0;dispatch({type:'RESET'});return;}
 if(button.dataset.step!==undefined){const index=Number(button.dataset.step);if(index===stepIndex){stepIndex++;dispatch(scenarios[walkIndex].steps[index][1]);}return;}
 if(button.dataset.answer){dispatch({type:'ANSWER',value:button.dataset.answer});return;}
 if(button.dataset.category){dispatch({type:'CATEGORY',value:button.dataset.category});return;}
 if(button.dataset.action){if(button.dataset.action==='RESET'||button.dataset.action==='PERFECT')stepIndex=0;dispatch({type:button.dataset.action});}
});
document.addEventListener('change',e=>{if(e.target.dataset.purpose!==undefined)dispatch({type:'ANSWER',index:Number(e.target.dataset.purpose),value:e.target.value||null});});
render();
</script>
</body>
</html>
